backend:
  name: github
  repo: Lzffancy/jeffshare
  branch: main
  base_url: https://jeffshare.com
  auth_endpoint: /admin-auth/github
  squash_merges: true

publish_mode: editorial_workflow

media_folder: "content/images"
public_folder: "/images"

site_url: https://jeffshare.com
display_url: https://jeffshare.com
logo_url: https://jeffshare.com/favicon.ico

locale: zh_Hans

collections:
  - name: "blog"
    label: "博客文章"
    label_singular: "文章"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}} — {{date}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "标签", name: "tags", widget: "list", default: [], field: { label: "标签", widget: "string" } }
      - { label: "草稿", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "正文", name: "body", widget: "markdown" }
